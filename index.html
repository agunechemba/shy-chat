<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="description" content="Ephemeral private chat rooms.">
  <meta name="color-scheme" content="dark">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="shy-chat">

  <title>shy-chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Update banner -->
  <div id="update-banner" class="update-banner" hidden>
    <span>A new version is available.</span>
    <div class="update-banner-actions">
      <button id="update-btn" type="button">Refresh</button>
      <button id="update-dismiss" type="button" aria-label="Dismiss">×</button>
    </div>
  </div>

  <!-- Join screen -->
  <div id="join-screen">
    <h1>shy-chat</h1>
    <input id="room-input" type="text" placeholder="Room name" maxlength="30"
           autocapitalize="off" autocomplete="off" spellcheck="false">
    <input id="user-input" type="text" placeholder="Your name" maxlength="20"
           autocomplete="off">
    <button id="join-btn" type="button">Join</button>
    <button id="install-btn" type="button" class="install-btn" hidden>Install app</button>
    <p id="ios-hint" class="ios-hint" hidden>
      Install: tap <b>Share</b> → <b>Add to Home Screen</b>
    </p>
    <p id="join-error" class="error" hidden></p>
    <footer class="app-footer">
      <a href="https://Agunechemba.github.io" target="_blank" rel="noopener noreferrer">Agunechemba Ekene</a>
    </footer>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen">
    <header id="chat-header">
      <h2 id="room-label"></h2>
      <button id="leave-btn" type="button">Leave</button>
    </header>
    <main id="messages" aria-live="polite"></main>
    <form id="input-area" autocomplete="off">
      <input id="message-input" type="text" placeholder="Type a message…"
             maxlength="500" enterkeyhint="send" autocapitalize="sentences">
      <button id="send-btn" type="submit">Send</button>
    </form>
    <footer class="app-footer">
      <a href="https://Agunechemba.github.io" target="_blank" rel="noopener noreferrer">Agunechemba Ekene</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
