<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>shy-chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Join screen -->
  <div id="join-screen">
    <h1>shy-chat</h1>
    <input id="room-input" type="text" placeholder="Room name" maxlength="30"
           autocapitalize="off" autocomplete="off" spellcheck="false">
    <input id="user-input" type="text" placeholder="Your name" maxlength="20"
           autocomplete="off">
    <button id="join-btn" type="button">Join</button>
    <p id="join-error" class="error" hidden></p>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen">
    <header id="chat-header">
      <h2 id="room-label"></h2>
      <button id="leave-btn" type="button">Leave</button>
    </header>
    <main id="messages" aria-live="polite"></main>
    <form id="input-area" autocomplete="off">
      <input id="message-input" type="text" placeholder="Type a message…"
             maxlength="500" enterkeyhint="send" autocapitalize="sentences">
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
